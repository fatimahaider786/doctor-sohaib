/* ————— Choreography —————
   One IntersectionObserver adds .in-view to [data-reveal] elements as they enter.
   Three entrances, deliberately different:
   fade  — soft rise for supporting text
   mask  — headline unrolls downward, like a press proof being pulled
   media — photographs develop: clipped, slightly large, settling into place
   [data-stagger] walks its children through one by one.               */

[data-reveal="fade"] {
  opacity: 0; transform: translateY(22px);
  transition: opacity 0.85s cubic-bezier(0.22, 0.61, 0.21, 1) var(--rd, 0ms),
              transform 0.85s cubic-bezier(0.22, 0.61, 0.21, 1) var(--rd, 0ms);
}
[data-reveal="fade"].in-view { opacity: 1; transform: none; }

/* mask: clip an inner wrapper, not the observed element itself — a fully
   clipped target has zero intersection area and never fires the observer */
[data-reveal="mask"] .rv {
  display: block;
  clip-path: inset(0 0 104% 0);
  transition: clip-path 0.95s cubic-bezier(0.77, 0, 0.18, 1) var(--rd, 0ms);
}
[data-reveal="mask"].in-view .rv { clip-path: inset(-14% -6% -18% -6%); }

[data-reveal="media"] { opacity: 0; transition: opacity 0.7s ease var(--rd, 0ms); }
[data-reveal="media"].in-view { opacity: 1; }
[data-reveal="media"] img, [data-reveal="media"] canvas {
  transform: scale(1.055) translateY(10px);
  clip-path: inset(9% 6% 9% 6% round 24px);
  transition: transform 1.2s cubic-bezier(0.19, 1, 0.22, 1) var(--rd, 0ms),
              clip-path 1.2s cubic-bezier(0.19, 1, 0.22, 1) var(--rd, 0ms);
}
[data-reveal="media"].in-view img, [data-reveal="media"].in-view canvas {
  transform: none; clip-path: inset(0 0 0 0 round 24px);
}

[data-stagger] > * {
  opacity: 0; transform: translateY(18px);
  transition: opacity 0.7s cubic-bezier(0.22, 0.61, 0.21, 1),
              transform 0.7s cubic-bezier(0.22, 0.61, 0.21, 1);
}
[data-stagger].in-view > * { opacity: 1; transform: none; }
[data-stagger].in-view > *:nth-child(2)  { transition-delay: 70ms; }
[data-stagger].in-view > *:nth-child(3)  { transition-delay: 140ms; }
[data-stagger].in-view > *:nth-child(4)  { transition-delay: 210ms; }
[data-stagger].in-view > *:nth-child(5)  { transition-delay: 280ms; }
[data-stagger].in-view > *:nth-child(6)  { transition-delay: 350ms; }
[data-stagger].in-view > *:nth-child(7)  { transition-delay: 420ms; }
[data-stagger].in-view > *:nth-child(8)  { transition-delay: 490ms; }
[data-stagger].in-view > *:nth-child(9)  { transition-delay: 560ms; }
[data-stagger].in-view > *:nth-child(10) { transition-delay: 630ms; }
[data-stagger].in-view > *:nth-child(n+11) { transition-delay: 700ms; }

@media (prefers-reduced-motion: reduce) {
  [data-reveal="fade"], [data-reveal="media"], [data-stagger] > * {
    opacity: 1 !important; transform: none !important;
  }
  [data-reveal="mask"] .rv { clip-path: none !important; }
  [data-reveal="media"] img, [data-reveal="media"] canvas { transform: none !important; clip-path: none !important; }
}

.cline__label { font-size: 0.8rem; color: var(--mist); }
.cline__val { font-weight: 600; color: var(--ink); text-decoration: none; font-size: 1.05rem; }
a.cline__val:hover { color: var(--uvea-deep); }
.cline__note { color: var(--mist); font-size: 0.86rem; }

.form { background: var(--saline); border: 1px solid var(--line); border-radius: 20px; padding: clamp(1.4rem, 3vw, 2.2rem); }
.form__row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 560px) { .form__row { grid-template-columns: 1fr; } }
.field { display: grid; gap: 0.35rem; margin-bottom: 1rem; }
.field label { font-size: 0.86rem; font-weight: 600; color: var(--ink); }
.field input, .field select, .field textarea {
  font-family: var(--sans); font-size: 0.95rem; color: var(--ink);
  background: var(--porcelain); border: 1px solid var(--line); border-radius: 10px;
  padding: 0.7rem 0.85rem; width: 100%;
}
.field textarea { min-height: 96px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--macula); outline-offset: 0; border-color: var(--uvea); }
.form__note { font-size: 0.84rem; color: var(--mist); margin-top: 0.9rem; }
.form__ok { margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 10px; background: rgba(21, 101, 91, 0.08); border: 1px solid rgba(21, 101, 91, 0.3); color: var(--uvea-deep); font-size: 0.9rem; }
@media (max-width: 920px) { .contact__grid { grid-template-columns: 1fr; } }

/* ————— Footer ————— */
.footer { background: var(--ink); color: var(--porcelain); padding: 3.2rem 0 2.4rem; }
.footer__grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) minmax(0, 1fr); gap: 2.5rem; }
.footer .brand__name, .footer .brand__role { color: var(--porcelain); }
.footer__blurb { color: var(--mist-dark); font-size: 0.92rem; margin-top: 1.1rem; max-width: 38ch; }
.footer__h { font-family: var(--serif); font-size: 1.05rem; font-weight: 500; margin-bottom: 1rem; }
.footer__links { list-style: none; display: grid; gap: 0.55rem; }
.footer__links a { color: var(--mist-dark); text-decoration: none; font-size: 0.92rem; }
.footer__links a:hover { color: var(--macula-bright); }
.footer__contact { color: var(--mist-dark); font-size: 0.92rem; display: grid; gap: 0.55rem; }
.footer__contact a { color: var(--mist-dark); text-decoration: none; }
.footer__contact a:hover { color: var(--macula-bright); }
.footer__base { margin-top: 2.8rem; padding-top: 1.4rem; border-top: 1px solid var(--line-dark); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: 0.82rem; color: var(--mist-dark); }
@media (max-width: 780px) { .footer__grid { grid-template-columns: 1fr; gap: 2rem; } }

</style>
